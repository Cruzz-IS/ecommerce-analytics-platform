version: 2

sources:
  - name: raw               
    schema: raw
    description: "Datos tal como llegan desde los CSV cargados por pipelines/load_raw.py"
    tables:
      - name: customers
      - name: products
      - name: orders
        columns:
          - name: order_id
            description: "Se repite a proposito: para comprobar si hay duplicados y actualizaciones entre lotes."
            data_tests:
              - unique:
                  config:
                    severity: warn     
      - name: order_items
      - name: payments
      - name: shipments

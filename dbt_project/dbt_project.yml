name: ecommerce
version: "1.0.0"
config-version: 2
profile: ecommerce            # debe coincidir con el nombre en profiles.yml

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce:
    staging:
      +schema: staging        # las tablas se crean en el esquema staging
      +materialized: table
      +post-hook: "ANALYZE {{ this }}"
    marts:
      +schema: marts
      +materialized: table
      +post-hook: "ANALYZE {{ this }}"
